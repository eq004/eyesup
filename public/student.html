<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Eyes Up — Join</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--paper);
  }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.8rem 1.1rem;
    font-size: 0.85rem; color: var(--muted);
  }
  .top .wordmark { font-size: 1rem; color: var(--ink); }
  main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 1.25rem;
    text-align: center;
  }
  .screen { width: 100%; max-width: 420px; animation: rise 0.35s ease both; }

  h1.q { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.3; margin-bottom: 1.4rem; }
  .mode-tag {
    display: inline-block; margin-bottom: 0.8rem;
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--accent-ink); background: var(--accent-soft);
    border-radius: 6px; padding: 0.2rem 0.55rem;
  }

  input[type="text"], textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    font-size: 1.05rem;
    background: var(--surface);
    resize: none;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .btn {
    display: block; width: 100%;
    border-radius: var(--radius);
    padding: 1rem;
    font-size: 1.1rem; font-weight: 800;
    margin-top: 0.8rem;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn.send { background: var(--accent); color: #fff; }
  .btn.choice {
    background: var(--surface);
    border: 1.5px solid var(--line);
    box-shadow: var(--shadow);
    padding: 1.15rem 1rem;
  }
  .btn.choice:active { border-color: var(--accent); background: var(--accent-soft); }
  .btn.huge { padding: 2.2rem 1rem; font-size: 1.35rem; }
  .btn .sub { display: block; font-size: 0.82rem; font-weight: 500; color: var(--muted); margin-top: 0.2rem; }

  .big-emoji { font-size: 4rem; line-height: 1; }
  .state-title { font-family: var(--font-display); font-size: 2.2rem; margin-top: 1rem; }
  .state-sub { color: var(--ink-soft); margin-top: 0.5rem; font-size: 1.05rem; }

  .rank-list { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 0.5rem; }
  .rank-item {
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 0.7rem 0.8rem;
    font-weight: 700; text-align: left;
  }
  .rank-item .pos {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; flex-shrink: 0;
  }
  .rank-item .label { flex: 1; }
  .rank-item button {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--paper);
    font-size: 1rem;
  }
  .rank-item button:disabled { opacity: 0.25; }

  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 0.9rem; }

  .btn.choice.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }

  .fld { display: block; text-align: left; margin-bottom: 0.7rem; }
  .fld span { display: block; font-size: 0.82rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 0.3rem; }

  .timer { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin-bottom: 0.35rem; }
  .timer-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.25s linear; }
  .timer-num { font-weight: 800; font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 0.8rem; }

  /* spelling test */
  .spell-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
  .spell-row { display: flex; align-items: center; gap: 0.6rem; }
  .spell-num {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 800; flex-shrink: 0;
  }
  .spell-row input { flex: 1; margin: 0; }

  /* cloze */
  .cloze-text {
    text-align: left;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    font-size: 1.05rem;
    line-height: 2.1;
    margin-bottom: 0.5rem;
  }
  .cloze-gap {
    display: inline-block;
    width: 110px;
    border: none;
    border-bottom: 2px solid var(--accent);
    border-radius: 6px 6px 0 0;
    background: var(--accent-soft);
    padding: 0.15rem 0.4rem;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0.2rem;
  }
  select.cloze-gap { width: auto; min-width: 110px; }

  /* counters */
  .ctr-tray {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 0.6rem 0.8rem;
  }
  .ctr-src { flex-shrink: 0; box-shadow: var(--shadow); border: 2px solid rgba(0,0,0,0.15); touch-action: none; }
  .ctr-src:active { transform: scale(1.15); }
  .ctr-tray-lbl { font-size: 0.75rem; color: var(--muted); text-align: left; line-height: 1.25; }
  .ctr-board {
    position: relative;
    width: 100%;
    aspect-ratio: 100 / 62;
    background: repeating-linear-gradient(0deg, #f4f2ea, #f4f2ea 24px, #eeece2 24px, #eeece2 25px);
    border: 1.5px solid var(--line);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    touch-action: none;
    overflow: hidden;
  }
  .ctr-piece {
    position: absolute;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    touch-action: none;
    cursor: grab;
  }

  /* working out */
  .work-pad {
    background: #23252e;
    border-radius: 14px 14px 0 0;
    padding: 0.7rem 0.9rem;
    text-align: right;
    font-family: ui-monospace, Menlo, monospace;
  }
  .work-lines { max-height: 96px; overflow-y: auto; color: #9aa0b5; font-size: 0.9rem; }
  .work-cur { color: #fff; font-size: 1.5rem; min-height: 1.5em; overflow-wrap: anywhere; }
  .work-keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.3rem;
    background: #191b22;
    padding: 0.5rem;
    border-radius: 0 0 14px 14px;
  }
  .wk {
    padding: 0.75rem 0;
    border-radius: 10px;
    background: #2e3347;
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .wk:active { background: var(--accent); }
  .wk.op { background: #3a3f55; }
  .wk.eq { background: var(--accent); grid-column: span 4; }
  .work-ans-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.7rem;
    font-weight: 800;
    font-size: 0.95rem;
  }
  .work-ans-row input {
    flex: 1;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 0.55rem 0.7rem;
    font-size: 1.1rem;
    font-weight: 800;
    text-align: center;
  }

  /* phonics keyboard */
  .phon-strip-row { display: flex; gap: 0.4rem; align-items: stretch; margin-bottom: 0.6rem; }
  .phon-strip {
    flex: 1;
    min-height: 52px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 0.4rem 0.5rem;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 3px;
  }
  .phon-placeholder { color: var(--muted); font-size: 0.85rem; }
  .phon-chip {
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    font-weight: 800;
    font-size: 1.15rem;
    background: #efe9d8; color: #3a3524;
  }
  .phon-ctl {
    width: 52px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    font-size: 1.2rem;
    font-weight: 700;
  }
  .phon-ctl:active { background: var(--red-soft); }
  .phon-board {
    background: #23252e;
    border-radius: 14px;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .phon-row { display: flex; justify-content: center; gap: 0.28rem; }
  .phon-key {
    flex: 1;
    max-width: 44px;
    min-width: 0;
    padding: 0.55rem 0;
    border-radius: 8px;
    font-weight: 800;
    font-size: 0.95rem;
    background: #efe9d8; color: #3a3524;
    transition: transform 0.06s ease;
  }
  .phon-key:active { transform: scale(1.15); }
  .phon-key.wide { max-width: 76px; font-size: 0.7rem; }
  .phon-key.pc-vow, .phon-chip.pc-vow { background: #ffd6e0; color: #7a2740; }
  .phon-key.pc-dig, .phon-chip.pc-dig { background: #cdeccb; color: #245c2a; }
  .phon-key.pc-team, .phon-chip.pc-team { background: #ddd2ec; color: #4b3670; }
  .phon-key.pc-sil, .phon-chip.pc-sil { background: #bfe3d9; color: #1f5c4d; }
  .phon-chip.pc-sil { font-style: italic; }
  .phon-divider { height: 1px; background: rgba(255,255,255,0.15); margin: 0.2rem 0.4rem; }

  .prompt-img {
    max-width: 100%;
    max-height: 34vh;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    margin-bottom: 0.9rem;
  }

  .scale-labels { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 0.5rem; }
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 12px;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--accent-soft), var(--accent));
    outline: none;
    margin: 0.6rem 0 0.4rem;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 4px solid var(--accent);
    box-shadow: var(--shadow-lift);
    cursor: grab;
  }
  input[type="range"]::-moz-range-thumb {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface);
    border: 4px solid var(--accent);
    box-shadow: var(--shadow-lift);
    cursor: grab;
  }
  .scale-value { font-size: 0.88rem; font-weight: 700; color: var(--ink-soft); min-height: 1.3em; }

  .smiley-row { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
  .smiley-btn {
    font-size: 2.7rem;
    line-height: 1;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 0.7rem 0.75rem;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease;
  }
  .smiley-btn:active { transform: scale(1.15); border-color: var(--accent); background: var(--accent-soft); }

  .venn-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-top: 0.8rem; }
  .venn-btns .btn.choice { margin-top: 0; padding: 0.85rem 0.4rem; font-size: 0.95rem; }
  .venn-sent { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.9rem; }
  .sent-chip {
    background: var(--green-soft); color: var(--green);
    border-radius: 999px; padding: 0.25rem 0.7rem;
    font-size: 0.8rem; font-weight: 700;
  }

  .match-list { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 0.4rem; }
  .match-row { display: flex; align-items: center; gap: 0.6rem; text-align: left; }
  .match-row .term { flex: 1; font-weight: 800; font-size: 0.95rem; }
  .match-row select {
    flex: 1.4;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem 0.5rem;
    background: var(--surface);
    font-size: 0.92rem;
  }

  #pad {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    touch-action: none;
    cursor: crosshair;
  }
  .change-link { margin-top: 1.2rem; color: var(--accent); font-weight: 700; font-size: 0.95rem; }

  .conn { position: fixed; bottom: 0.6rem; left: 0; right: 0; text-align: center; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="top">
    <span class="wordmark">Eyes Up 👀</span>
    <span id="topInfo"></span>
  </div>
  <main><div class="screen" id="screen"></div></main>
  <div class="conn" id="conn"></div>
  <script src="/student.js"></script>
</body>
</html>
