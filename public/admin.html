<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0e2445" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Eyes Up — Owner admin</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { background: var(--paper); }
  header {
    display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.5rem;
    background: var(--navy); color: var(--navy-text); border-bottom: 1px solid var(--navy-2);
    position: sticky; top: 0; z-index: 10;
  }
  header .wordmark { font-size: 1.2rem; }
  header .spacer { flex: 1; }
  header a {
    text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.45rem 0.9rem; font-weight: 700; font-size: 0.88rem; background: var(--surface);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 1.4rem 1.5rem 4rem; }
  .muted { color: var(--muted); }
  .gate { text-align: center; padding: 4rem 1rem; font-size: 1.05rem; line-height: 1.7; }
  .gate a { color: var(--accent); font-weight: 700; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow); }
  .tile .v { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
  .tile .k { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
  .tile.live .v { color: var(--green); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 1.2rem 1.4rem; margin-top: 1.2rem; }
  .card h2 { font-size: 1rem; font-weight: 800; margin-bottom: 0.2rem; }
  .card .sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.9rem; }

  .setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.6rem; }
  .setup .item { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.7rem 0.8rem; border-radius: 12px; background: var(--paper); font-size: 0.86rem; line-height: 1.4; }
  .setup .item b { display: block; }
  .setup .dot { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: #fff; }
  .setup .on .dot { background: var(--green); }
  .setup .off .dot { background: var(--amber); }

  .toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.8rem; }
  .toolbar input, .toolbar select { font: inherit; font-size: 0.9rem; padding: 0.5rem 0.8rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .toolbar input { flex: 1; min-width: 180px; }

  .ttable { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .ttable th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0.5rem 0.6rem; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
  .ttable td { padding: 0.65rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .ttable tr.off td { opacity: 0.55; }
  .ttable .who b { display: block; }
  .ttable .who small { color: var(--muted); display: block; }
  .ttable .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tscroll { overflow-x: auto; }

  .badge { display: inline-block; padding: 0.18rem 0.6rem; border-radius: 999px; font-size: 0.74rem; font-weight: 800; white-space: nowrap; }
  .b-owner { background: var(--navy); color: #fff; }
  .b-free { background: var(--accent-soft); color: var(--accent); }
  .b-trial { background: #fbf0d9; color: #8a5a10; }
  .b-paid { background: var(--green-soft); color: #1f6b46; }
  .b-school { background: #ece6f7; color: #5a3c9a; }
  .b-ended, .b-disabled { background: var(--red-soft); color: #a33; }
  .badge + small { display: block; color: var(--muted); font-size: 0.74rem; margin-top: 0.15rem; }

  .btn-s { font: inherit; font-size: 0.82rem; font-weight: 700; padding: 0.4rem 0.8rem; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .btn-s:hover { background: var(--paper); }
  .btn-s.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-s.danger { color: var(--red); }

  .overlay { position: fixed; inset: 0; z-index: 40; background: rgba(8, 20, 44, 0.55); display: none; align-items: flex-start; justify-content: center; padding: 3rem 1rem; overflow-y: auto; }
  .overlay.show { display: flex; }
  .sheet { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lift); width: min(520px, 100%); padding: 1.4rem 1.5rem; }
  .sheet h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 0.2rem; }
  .sheet .row { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.9rem; }
  .sheet label { font-size: 0.78rem; font-weight: 800; color: var(--ink-soft); }
  .sheet input, .sheet select, .sheet textarea { font: inherit; font-size: 0.92rem; padding: 0.55rem 0.8rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
  .sheet .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.1rem; }
  .sheet hr { border: 0; border-top: 1px solid var(--line); margin: 1.1rem 0 0; }
  .pwbox { margin-top: 0.8rem; padding: 0.8rem 1rem; border-radius: 12px; background: var(--green-soft); font-size: 0.9rem; line-height: 1.5; }
  .pwbox code { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.02em; user-select: all; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 0.7rem 1.2rem; border-radius: 999px; font-weight: 700; font-size: 0.9rem; z-index: 60; box-shadow: var(--shadow-lift); }
</style>
</head>
<body>
  <header>
    <span class="wordmark inverted"><svg class="logo-eyes" viewBox="0 0 124 62" aria-hidden="true" focusable="false"><circle cx="31" cy="31" r="26" fill="var(--eyeball)" stroke="currentColor" stroke-width="9"/><circle cx="93" cy="31" r="26" fill="var(--eyeball)" stroke="currentColor" stroke-width="9"/><circle cx="39" cy="23" r="11.5" fill="currentColor"/><circle cx="101" cy="23" r="11.5" fill="currentColor"/><circle cx="35.5" cy="19" r="3.6" fill="var(--eyeball)"/><circle cx="97.5" cy="19" r="3.6" fill="var(--eyeball)"/></svg><span class="logo-text">eyes up</span><span class="logo-sub">· Owner admin</span></span>
    <span class="spacer"></span>
    <a href="/teacher">← Back to dashboard</a>
  </header>
  <div class="wrap" id="wrap"><div class="gate muted">Loading…</div></div>
  <div class="overlay" id="sheetOverlay"><div class="sheet" id="sheet"></div></div>
  <script src="/admin.js"></script>
</body>
</html>
