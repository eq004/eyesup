<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0e2445" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Eyes Up — Data</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { background: var(--paper); }
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1.5rem;
    background: var(--navy);
    color: var(--navy-text);
    border-bottom: 1px solid var(--navy-2);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .wordmark { font-size: 1.2rem; }
  header .spacer { flex: 1; }
  header a {
    text-decoration: none;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.45rem 0.9rem;
    font-weight: 700;
    font-size: 0.88rem;
    background: var(--surface);
  }
  header a:hover { background: var(--paper); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 1.4rem 1.5rem 4rem; }
  .muted { color: var(--muted); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow);
    animation: rise 0.4s ease both;
  }
  .tile .v { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
  .tile .k { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 1.2rem 1.4rem;
    margin-top: 1.2rem;
    animation: rise 0.4s ease both;
  }
  .card h2 { font-size: 1rem; font-weight: 800; margin-bottom: 0.2rem; }
  .card .sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.9rem; }

  /* lesson bars */
  .lchart { display: flex; align-items: flex-end; gap: 10px; height: 190px; padding-top: 1.4rem; overflow-x: auto; }
  .lbar { flex: 1; min-width: 46px; max-width: 90px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .lbar .stack { width: 100%; display: flex; flex-direction: column; justify-content: flex-end; height: 130px; position: relative; }
  .lbar .joined { background: #dfe6f0; border-radius: 6px 6px 0 0; width: 100%; position: absolute; bottom: 0; }
  .lbar .part { background: var(--accent); border-radius: 6px 6px 0 0; width: 100%; position: absolute; bottom: 0; transition: background 0.15s ease; }
  .lbar:hover .part, .lbar.sel .part { background: var(--accent-ink); }
  .lbar.sel .lab { color: var(--accent-ink); }
  .lbar .pct { font-size: 0.75rem; font-weight: 800; margin-top: 0.3rem; }
  .lbar .lab { font-size: 0.68rem; color: var(--muted); text-align: center; line-height: 1.2; margin-top: 0.1rem; white-space: nowrap; }

  /* mode mix */
  .mix-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.45rem; font-size: 0.88rem; }
  .mix-row .nm { min-width: 170px; font-weight: 700; }
  .mix-row .track { flex: 1; height: 14px; background: #e9eef5; border-radius: 8px; overflow: hidden; }
  .mix-row .fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--accent), #7fa3dc); }
  .mix-row .n { min-width: 2.4ch; text-align: right; font-weight: 800; }

  /* lesson detail */
  .ichart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 1.6rem; overflow-x: auto; }
  .ibar { flex: 1; min-width: 34px; max-width: 64px; display: flex; flex-direction: column; align-items: center; }
  .ibar .bar { width: 100%; background: linear-gradient(180deg, #7fa3dc, var(--accent)); border-radius: 6px 6px 0 0; position: relative; }
  .ibar .cnt { font-size: 0.72rem; font-weight: 800; margin-top: 0.25rem; }
  .ibar .ic { font-size: 1rem; margin-top: 0.05rem; }
  .ibar[title] { cursor: default; }

  table.stab { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  .stab th {
    text-align: left;
    padding: 0.45rem 0.6rem;
    border-bottom: 2px solid var(--line);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .stab th:hover { color: var(--accent-ink); }
  .stab td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #e5eaf2; }
  .stab .bar-cell { width: 40%; }
  .stab .pbarr { height: 10px; background: #e9eef5; border-radius: 6px; overflow: hidden; }
  .stab .pfill { height: 100%; border-radius: 6px; }
  .p-hi { background: #2f9e44; }
  .p-mid { background: #e8a13c; }
  .p-lo { background: #d64545; }
  .search {
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 0.5rem 0.8rem;
    font-size: 0.9rem;
    width: 220px;
    margin-bottom: 0.7rem;
  }
  .gate { text-align: center; padding: 5rem 1rem; }
  .gate a { color: var(--accent); font-weight: 700; }

  /* detail tabs */
  .dtabs { display: flex; gap: 0.5rem; margin: 0.9rem 0 1.1rem; flex-wrap: wrap; }
  .dtab {
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 0.45rem 1rem;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
  }
  .dtab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .share-row { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .dtabs .spacer { flex: 1; }
  .dtab.viz { background: linear-gradient(135deg, var(--accent), #5b7fc7); border-color: transparent; color: #fff; font-weight: 800; }
  .dtab.viz:hover { filter: brightness(1.08); }

  /* ✨ Lesson snapshot */
  .snap-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 44, 0.55); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .snap { background: var(--surface); color: var(--ink); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.35); width: min(860px, 100%); padding: 1.6rem 1.8rem 1.4rem; }
  .snap-head { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; margin-bottom: 1rem; }
  .snap-head h2 { font-size: 1.4rem; font-weight: 800; margin: 0.1rem 0; }
  .snap-kicker { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .snap-actions { margin-left: auto; display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .share-btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .snap-top { display: flex; align-items: center; gap: 1.6rem; padding: 1rem 1.2rem; border-radius: 16px; background: var(--paper); margin-bottom: 1.2rem; flex-wrap: wrap; }
  .snap-ring { width: 118px; height: 118px; flex: 0 0 auto; }
  .snap-ring circle { fill: none; stroke-width: 11; }
  .snap-ring .bg { stroke: var(--line); }
  .snap-ring .fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.8s ease; }
  .snap-ring text { font-size: 1.5rem; font-weight: 800; fill: var(--ink); }
  .snap-nums { display: flex; gap: 1.6rem; flex-wrap: wrap; }
  .snap-nums div { display: flex; flex-direction: column; }
  .snap-nums b { font-size: 1.8rem; font-weight: 800; line-height: 1.1; }
  .snap-nums span { color: var(--muted); font-size: 0.82rem; }
  .snap h3 { font-size: 0.95rem; font-weight: 800; margin: 1rem 0 0.5rem; }
  .snap-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.45rem; }
  .snap-list li { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.6rem 0.8rem; border-radius: 12px; background: var(--paper); font-size: 0.95rem; line-height: 1.4; }
  .snap-list .ic { flex: 0 0 auto; font-size: 1.1rem; }
  .snap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.8rem; }
  .snap-vis { border: 1px solid var(--line); border-radius: 14px; padding: 0.8rem 0.9rem; }
  .snap-vis h4 { font-size: 0.82rem; font-weight: 800; margin: 0 0 0.6rem; color: var(--ink-soft, var(--ink)); }
  .snap-energy { display: flex; gap: 0.5rem; align-items: flex-end; overflow-x: auto; padding-bottom: 0.2rem; }
  .snap-energy .se { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; min-width: 30px; }
  .snap-energy .n { font-size: 0.72rem; font-weight: 700; color: var(--muted); }
  .snap-energy .b { width: 20px; border-radius: 6px 6px 3px 3px; background: var(--accent); display: block; }
  .snap-energy .i { font-size: 0.9rem; }
  .snap-bar { display: grid; grid-template-columns: minmax(6rem, 1fr) 2fr auto; gap: 0.6rem; align-items: center; font-size: 0.85rem; margin-bottom: 0.35rem; }
  .snap-bar .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snap-bar .t { height: 10px; border-radius: 6px; background: var(--paper); overflow: hidden; display: block; }
  .snap-bar .f { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  .snap-bar.good .f { background: #2f9e6a; }
  .snap-bar .c { color: var(--muted); white-space: nowrap; font-weight: 700; }
  .snap-words { display: flex; flex-wrap: wrap; gap: 0.4rem 0.7rem; align-items: baseline; }
  .snap-words span { font-weight: 800; color: var(--accent); }
  .snap-words small { font-weight: 600; color: var(--muted); margin-left: 0.15rem; font-size: 0.7rem; }
  @media print {
    body.snap-open > *:not(.snap-overlay) { display: none !important; }
    .snap-overlay { position: static; background: none; padding: 0; backdrop-filter: none; }
    .snap { box-shadow: none; width: 100%; }
    .snap-actions { display: none; }
  }
  .share-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 0.5rem 1rem;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
  }
  .share-btn:hover { background: var(--accent-ink); }
  .share-link {
    font-size: 0.8rem;
    color: var(--accent-ink);
    background: #e6edf7;
    border-radius: 8px;
    padding: 0.35rem 0.6rem;
    word-break: break-all;
  }
</style>
</head>
<body>
  <header>
    <span class="wordmark inverted"><svg class="logo-eyes" viewBox="0 0 124 62" aria-hidden="true" focusable="false"><circle cx="31" cy="31" r="26" fill="var(--eyeball)" stroke="currentColor" stroke-width="9"/><circle cx="93" cy="31" r="26" fill="var(--eyeball)" stroke="currentColor" stroke-width="9"/><circle cx="39" cy="23" r="11.5" fill="currentColor"/><circle cx="101" cy="23" r="11.5" fill="currentColor"/><circle cx="35.5" cy="19" r="3.6" fill="var(--eyeball)"/><circle cx="97.5" cy="19" r="3.6" fill="var(--eyeball)"/></svg><span class="logo-text">eyes up</span><span class="logo-sub">· Data</span></span>
    <span class="spacer"></span>
    <a href="/teacher">← Back to dashboard</a>
  </header>
  <div class="wrap" id="wrap"><div class="gate muted">Loading your data…</div></div>
  <script src="/insights-render.js"></script>
  <script src="/data.js"></script>
</body>
</html>
