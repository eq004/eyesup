<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0e2445" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Eyes Up — Lesson dashboard</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { background: var(--paper); }
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 0.9rem 1.5rem;
    background: var(--navy);
    color: var(--navy-text);
    border-bottom: 1px solid var(--navy-2);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .wordmark { font-size: 1.2rem; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.4rem 1.5rem 4rem; }
  .muted { color: var(--muted); }
  .gate { text-align: center; padding: 5rem 1rem; }
  h1.title { font-family: var(--font-display); font-size: 1.7rem; margin-bottom: 0.15rem; }
  .lmeta { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.3rem; }
  .stats { display: flex; gap: 1.6rem; flex-wrap: wrap; margin-bottom: 1.3rem; }
  .stats .st b { font-size: 1.5rem; display: block; line-height: 1.1; }
  .stats .st span { color: var(--muted); font-size: 0.78rem; }
  .pdf-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 0.5rem 1rem;
    font-weight: 800;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
  }
  .pdf-btn:hover { background: var(--accent-ink); }
  @media print {
    header, .no-print { display: none !important; }
    body { background: #fff; }
    .wrap { padding: 0; max-width: none; }
  }
  @page { margin: 14mm 12mm; }
</style>
</head>
<body>
  <header>
    <span class="wordmark inverted"><svg class="logo-eyes" viewBox="0 0 124 62" aria-hidden="true" focusable="false"><circle cx="31" cy="31" r="26" fill="var(--eyeball)" stroke="currentColor" stroke-width="9"/><circle cx="93" cy="31" r="26" fill="var(--eyeball)" stroke="currentColor" stroke-width="9"/><circle cx="39" cy="23" r="11.5" fill="currentColor"/><circle cx="101" cy="23" r="11.5" fill="currentColor"/><circle cx="35.5" cy="19" r="3.6" fill="var(--eyeball)"/><circle cx="97.5" cy="19" r="3.6" fill="var(--eyeball)"/></svg><span class="logo-text">eyes up</span><span class="logo-sub" id="pageKind">· Lesson dashboard</span></span>
  </header>
  <div class="wrap" id="wrap"><div class="gate muted">Loading…</div></div>
  <script src="/marks.js"></script>
  <script src="/lesson-view.js"></script>
  <script src="/insights-render.js"></script>
  <script src="/auth.js"></script>
  <script src="/insights.js"></script>
  <p class="made-with">Made with Eyes Up by <a href="https://peakyou.com.au">PeakYou</a> · peakyou.com.au</p>
</body>
</html>
