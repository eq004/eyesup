<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eyes Up — the teacher holds the room</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    background:
      radial-gradient(1200px 600px at 80% -10%, #eef0ff 0%, transparent 60%),
      var(--paper);
  }
  .hero { text-align: center; max-width: 640px; animation: rise 0.5s ease both; }
  .hero .wordmark { font-size: clamp(2.2rem, 6vw, 3.2rem); }
  .tagline { margin-top: 0.5rem; font-size: 1.05rem; color: var(--ink-soft); }

  /* students first: code entry is the hero */
  .join-box {
    margin-top: 2rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lift);
    padding: 1.6rem 1.6rem 1.4rem;
    width: 100%;
    max-width: 460px;
    animation: rise 0.5s 0.08s ease both;
  }
  .join-box h2 { font-size: 1.1rem; font-weight: 800; }
  .join-row { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
  .join-row input {
    flex: 1;
    min-width: 0;
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 0.8rem 0.8rem;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.3em;
    text-align: center;
    text-transform: uppercase;
  }
  .join-row input:focus { outline: none; border-color: var(--accent); }
  .join-row button {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 1.05rem;
    border-radius: 12px;
    padding: 0 1.4rem;
  }
  .join-row button:active { transform: scale(0.97); }
  .join-box .sub { color: var(--muted); font-size: 0.82rem; margin-top: 0.7rem; }

  .cards {
    margin-top: 2.2rem;
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fade-in 0.6s 0.2s ease both;
  }
  a.card {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.55rem 1.1rem;
    font-size: 0.92rem;
    font-weight: 700;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); color: var(--ink); }
  .foot { margin-top: 2.6rem; color: var(--muted); font-size: 0.88rem; text-align: center; }
</style>
</head>
<body>
  <div class="hero">
    <div class="wordmark">Eyes Up<span class="eye">👀</span></div>
    <p class="tagline">The teacher holds the room. The room responds.</p>
  </div>

  <div class="join-box">
    <h2>🙋 Joining a class?</h2>
    <div class="join-row">
      <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autofocus
        aria-label="Class code" />
      <button id="go">Join</button>
    </div>
    <p class="sub">Type the 4-letter code on the board — no account needed.</p>
  </div>

  <div class="cards">
    <a class="card" href="/teacher">🎼 I'm the teacher</a>
    <a class="card" href="/projector">📽️ Classroom screen</a>
  </div>

  <p class="foot">Teach → Ask → Respond → Reveal → Discuss → Teach</p>

  <script>
    const code = document.getElementById("code");
    const go = () => {
      const c = code.value.trim().toUpperCase();
      if (c.length === 4) location.href = "/join?code=" + encodeURIComponent(c);
    };
    document.getElementById("go").onclick = go;
    code.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    code.addEventListener("input", () => { if (code.value.trim().length === 4) go(); });
  </script>
</body>
</html>
