<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0e2445" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Eyes Up — Lesson Report</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { background: #fff; }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 2rem 4rem;
  }
  .report-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 1.2rem;
  }
  .report-head h1 { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; }
  .report-head .meta { text-align: right; color: var(--ink-soft); font-size: 0.9rem; }
  .report-head .meta b { color: var(--ink); letter-spacing: 0.15em; }

  .stat-row { display: flex; gap: 1rem; margin: 1.6rem 0; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 150px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
  }
  .stat .v { font-size: 1.8rem; font-weight: 800; }
  .stat .k { color: var(--muted); font-size: 0.82rem; }

  h2.sec {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 2rem 0 0.7rem;
  }
  .word-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .word-chip {
    background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 999px; padding: 0.25rem 0.75rem;
    font-weight: 700; font-size: 0.88rem;
  }
  .word-chip small { opacity: 0.6; margin-left: 0.3rem; }

  .itx {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
    break-inside: avoid;
  }
  .itx .mode { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent-ink); }
  .itx h3 { font-family: var(--font-display); font-size: 1.15rem; margin: 0.3rem 0 0.6rem; }
  .itx .n { color: var(--muted); font-size: 0.82rem; }
  .dist { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .dist .row { display: flex; align-items: center; gap: 0.7rem; font-size: 0.9rem; }
  .dist .lbl { min-width: 130px; font-weight: 700; }
  .dist .track { flex: 1; height: 12px; background: #e8edf4; border-radius: 6px; overflow: hidden; }
  .dist .fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .dist .num { min-width: 2ch; text-align: right; color: var(--ink-soft); }
  ol.answers, ol.ranked-list { margin: 0.5rem 0 0 1.2rem; }
  ol.answers li, ol.ranked-list li { margin-bottom: 0.35rem; font-size: 0.95rem; }
  ol.answers { list-style: none; margin-left: 0; }
  ol.answers li { border-left: 3px solid var(--line); padding-left: 0.8rem; }

  .who-list {
    margin-top: 0.7rem;
    border-top: 1px dashed var(--line);
    padding-top: 0.55rem;
    display: grid;
    grid-template-columns: minmax(90px, max-content) 1fr;
    column-gap: 0.9rem;
    row-gap: 0.25rem;
    font-size: 0.85rem;
  }
  .who-row { display: contents; }
  .who-name { font-weight: 700; color: var(--ink-soft); }
  .who-resp { color: var(--ink); overflow-wrap: anywhere; }
  .who-note { margin-top: 0.55rem; font-size: 0.78rem; color: var(--muted); }

  .edit-btn {
    margin-left: 0.45rem;
    font-size: 0.75em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 0.1em 0.45em;
    vertical-align: middle;
    background: var(--surface);
  }
  .edit-btn:hover { color: var(--accent-ink); border-color: var(--accent); }
  .edit-hint {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-radius: 10px;
    padding: 0.55rem 0.9rem;
    font-size: 0.84rem;
    font-weight: 600;
    margin-bottom: 1.1rem;
  }
  @media print { .edit-btn, .edit-hint { display: none !important; } }

  /* student pictures (live report only) — print one per A4 page if big */
  .img-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 0.8rem; }
  .img-gallery figure { margin: 0; text-align: center; break-inside: avoid; }
  .img-gallery img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .img-gallery figcaption { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.3rem; font-weight: 700; }
  .img-gallery .img-text { font-size: 0.9rem; text-align: left; margin: 0.5rem 0 0; line-height: 1.45; }
  .dl-btn { display: inline-block; margin-top: 0.5rem; text-decoration: none; font-weight: 800; font-size: 0.85rem; color: var(--accent); border: 1.5px solid var(--line); border-radius: 8px; padding: 0.3rem 0.7rem; }
  @media print { .dl-btn { display: none !important; } }
  @media print {
    .itx.has-gallery { page-break-inside: auto; }
    .img-gallery { display: block; }
    .img-gallery figure { page-break-inside: avoid; margin: 0 0 0.8cm; }
    .img-gallery img { max-height: 24cm; }
  }

  .note { margin-top: 2.2rem; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 1rem; }

  .print-bar {
    position: sticky; top: 0;
    display: flex; justify-content: flex-end; gap: 0.6rem;
    padding: 0.8rem 2rem;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .print-bar button {
    background: var(--accent); color: #fff;
    font-weight: 700; border-radius: 10px;
    padding: 0.5rem 1.2rem;
  }
  .print-bar .hint { align-self: center; color: var(--muted); font-size: 0.82rem; }

  .err { text-align: center; padding: 4rem 1rem; color: var(--ink-soft); }

  /* Colours must survive print-to-PDF — browsers strip backgrounds by default. */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @page { margin: 1.4cm; }
  @media print {
    .print-bar { display: none; }
    .page { padding: 0; max-width: none; }
    body { background: #fff; }
    .stat, .itx { border-color: #ccc; }
    .itx { page-break-inside: avoid; }
    svg { max-width: 100%; }
  }

  .cloud-print { text-align: center; margin: 0.6rem 0 0.4rem; }
  .cloud-print svg { max-height: 330px; width: 100%; }

  .smiley-print { display: flex; justify-content: center; align-items: flex-end; gap: 1.6rem; margin: 0.8rem 0 0.4rem; }
  .smiley-print .sp-cell { text-align: center; }
  .smiley-print .sp-face { line-height: 1.1; }
  .smiley-print .sp-n { font-weight: 800; margin-top: 0.2rem; }
  .smiley-print .sp-p { color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
  <div class="print-bar">
    <span class="hint">A print dialog opens — set the destination/printer to “Save as PDF”.</span>
    <a id="allImagesBtn" data-dl class="dl-btn" style="display:none;font-size:0.95rem;padding:0.55rem 1rem;margin:0 0.6rem 0 0;background:#fff">⬇ Download all student images (ZIP)</a>
    <button id="printBtn" style="font-size:1rem;padding:0.6rem 1.5rem">🖨 Print / Save as PDF</button>
  </div>
  <div class="page" id="page"><div class="err">Loading report…</div></div>
  <script src="/auth.js"></script>
  <script src="/marks.js"></script>
  <script src="/lesson-view.js"></script>

<script src="/report.js"></script>
  <p class="made-with">Made with Eyes Up by <a href="https://peakyou.com.au">PeakYou</a> · peakyou.com.au</p>
</body>
</html>
