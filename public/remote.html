<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Eyes Up — Remote</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--ink);
    color: #eef0f6;
    padding-bottom: 2rem;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 1rem;
    font-size: 0.85rem;
    color: #9aa0b5;
    position: sticky;
    top: 0;
    background: var(--ink);
    z-index: 10;
  }
  .top .wordmark { color: #fff; font-size: 1rem; }
  .top b { color: #fff; letter-spacing: 0.12em; }

  main { padding: 0 0.9rem; max-width: 520px; margin: 0 auto; }

  .status {
    background: #262a3a;
    border: 1px solid #3a3f55;
    border-radius: 14px;
    padding: 0.8rem 1rem;
    margin-bottom: 0.8rem;
  }
  .status .mode { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #9db1ff; }
  .status .q { font-weight: 700; font-size: 1rem; line-height: 1.3; margin-top: 0.2rem; }
  .status .meta { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.82rem; color: #9aa0b5; }
  .status .meta b { color: #fff; }
  .status .open-tag { color: #7bdc9f; font-weight: 700; }
  .status .closed-tag { color: #e79191; font-weight: 700; }

  .rbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    border-radius: 14px;
    padding: 0.95rem;
    font-size: 1rem;
    font-weight: 800;
    background: #2e3347;
    border: 1px solid #3a3f55;
    color: #eef0f6;
    margin-bottom: 0.55rem;
    transition: transform 0.08s ease;
  }
  .rbtn:active { transform: scale(0.97); }
  .rbtn.eyes { background: #f4f2ea; color: #14161f; font-size: 1.25rem; padding: 1.15rem; }
  .rbtn.accent { background: var(--accent); border-color: var(--accent); }
  .rbtn:disabled { opacity: 0.4; }
  .btn-row { display: flex; gap: 0.55rem; }
  .btn-row .rbtn { flex: 1; font-size: 0.88rem; padding: 0.8rem 0.4rem; }

  h3.sec {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #9aa0b5;
    margin: 1.1rem 0 0.5rem;
  }
  .launch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
  .launch-grid .rbtn { flex-direction: column; gap: 0.15rem; font-size: 0.72rem; padding: 0.7rem 0.2rem; margin: 0; }
  .launch-grid .rbtn .ic { font-size: 1.3rem; }

  .timer-row { display: flex; gap: 0.5rem; align-items: center; }
  .timer-row .rbtn { margin: 0; padding: 0.65rem 0.4rem; font-size: 0.85rem; flex: 1; }
  .timer-live { font-variant-numeric: tabular-nums; font-weight: 800; color: #9db1ff; min-width: 52px; text-align: center; }

  /* connect form */
  .gate { max-width: 340px; margin: 14vh auto 0; text-align: center; padding: 0 1rem; }
  .gate input {
    width: 100%;
    background: #262a3a;
    border: 1.5px solid #3a3f55;
    color: #fff;
    border-radius: 12px;
    padding: 0.85rem;
    font-size: 1.1rem;
    text-align: center;
    margin-top: 0.6rem;
  }
  .gate input#codeIn { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 800; }
  .gate .err { color: #e79191; font-size: 0.85rem; margin-top: 0.6rem; }
  .conn { position: fixed; bottom: 0.4rem; left: 0; right: 0; text-align: center; font-size: 0.72rem; color: #9aa0b5; }
</style>
</head>
<body>
  <div class="top">
    <span class="wordmark">Eyes Up 👀 <span style="font-weight:500;color:#9aa0b5">remote</span></span>
    <span id="topInfo"></span>
  </div>
  <main id="main"></main>
  <div class="conn" id="conn"></div>
  <script src="/remote.js"></script>
</body>
</html>
