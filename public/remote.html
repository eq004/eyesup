<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Eyes Up — Remote</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  :root { --rbg: #14161f; --rcard: #262a3a; --rline: #3a3f55; --rdim: #9aa0b5; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--rbg);
    color: #eef0f6;
    padding-bottom: calc(4.6rem + env(safe-area-inset-bottom));
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1rem;
    font-size: 0.85rem;
    color: var(--rdim);
    position: sticky;
    top: 0;
    background: var(--rbg);
    z-index: 10;
    border-bottom: 1px solid #20232f;
  }
  .top .wordmark { color: #fff; font-size: 1rem; }
  .top b { color: #fff; letter-spacing: 0.12em; }

  main { padding: 0.8rem 0.9rem 0; max-width: 560px; margin: 0 auto; }

  /* bottom tab bar */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: #191b25;
    border-top: 1px solid #2a2e3f;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  .tabbar button {
    flex: 1;
    padding: 0.6rem 0 0.7rem;
    color: var(--rdim);
    font-size: 0.68rem;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }
  .tabbar button .ti { font-size: 1.25rem; line-height: 1; }
  .tabbar button.on { color: #fff; }
  .tabbar button.on .ti { transform: scale(1.12); }

  /* cards & buttons */
  .status {
    background: var(--rcard);
    border: 1px solid var(--rline);
    border-radius: 14px;
    padding: 0.8rem 1rem;
    margin-bottom: 0.8rem;
  }
  .status .mode { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #9db1ff; }
  .status .q { font-weight: 700; font-size: 1rem; line-height: 1.3; margin-top: 0.2rem; }
  .status .meta { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.82rem; color: var(--rdim); flex-wrap: wrap; }
  .status .meta b { color: #fff; }
  .open-tag { color: #7bdc9f; font-weight: 700; }
  .closed-tag { color: #e79191; font-weight: 700; }

  .rbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    border-radius: 14px;
    padding: 0.95rem;
    font-size: 1rem;
    font-weight: 800;
    background: #2e3347;
    border: 1px solid var(--rline);
    color: #eef0f6;
    margin-bottom: 0.55rem;
    transition: transform 0.08s ease;
    min-height: 48px;
  }
  .rbtn:active { transform: scale(0.97); }
  .rbtn.eyes { background: #f4f2ea; color: #14161f; font-size: 1.25rem; padding: 1.1rem; }
  .rbtn.accent { background: var(--accent); border-color: var(--accent); }
  .rbtn.warn { color: #e79191; }
  .rbtn:disabled { opacity: 0.4; }
  .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn-row .rbtn { flex: 1 1 30%; font-size: 0.85rem; padding: 0.75rem 0.3rem; }

  h3.sec {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--rdim);
    margin: 1.1rem 0 0.5rem;
  }

  /* launch grid */
  .launch-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
  .launch-grid .rbtn { flex-direction: column; gap: 0.15rem; font-size: 0.7rem; padding: 0.7rem 0.2rem; margin: 0; min-height: 62px; }
  .launch-grid .rbtn .ic { font-size: 1.35rem; }
  .cat-label { grid-column: 1 / -1; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rdim); margin-top: 0.4rem; }

  /* inputs */
  .rin, textarea.rin, select.rin {
    width: 100%;
    background: var(--rcard);
    border: 1.5px solid var(--rline);
    color: #fff;
    border-radius: 12px;
    padding: 0.8rem;
    font-size: 1rem;
    margin-bottom: 0.5rem;
  }
  .rin::placeholder { color: #6f7590; }
  .pair-row { display: flex; gap: 0.4rem; align-items: center; }
  .pair-row .rin { flex: 1; }
  .pair-eq { color: #9db1ff; font-weight: 800; }

  /* composer / summary sheets */
  .sheet-wrap {
    position: fixed; inset: 0;
    background: rgba(10, 11, 16, 0.7);
    z-index: 40;
    display: none;
    align-items: flex-end;
  }
  .sheet-wrap.show { display: flex; }
  .sheet {
    background: #1c1f2b;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 88dvh;
    overflow-y: auto;
    padding: 1.1rem 1rem calc(1.2rem + env(safe-area-inset-bottom));
  }
  .sheet h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.7rem; }
  .sheet .close-x { float: right; color: var(--rdim); font-size: 1.3rem; padding: 0 0.4rem; }

  /* live responses */
  .resp-row {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    background: var(--rcard);
    border: 1px solid var(--rline);
    border-radius: 12px;
    padding: 0.55rem 0.7rem;
    margin-bottom: 0.45rem;
    font-size: 0.85rem;
  }
  .resp-row .rr-who { font-weight: 800; color: #9db1ff; min-width: 56px; font-size: 0.78rem; }
  .resp-row .rr-what { flex: 1; overflow-wrap: anywhere; color: #d9dcec; }
  .resp-row .rr-tgl {
    font-size: 0.72rem; font-weight: 800;
    border: 1px solid var(--rline);
    border-radius: 8px;
    padding: 0.3rem 0.5rem;
    color: var(--rdim);
    flex-shrink: 0;
  }
  .resp-row .rr-tgl.on { color: #7bdc9f; border-color: #3f7d54; }

  .mini-bar { margin-bottom: 0.45rem; font-size: 0.82rem; }
  .mini-bar .mb-top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 0.15rem; }
  .mini-bar .mb-track { height: 7px; border-radius: 4px; background: #20232f; overflow: hidden; }
  .mini-bar .mb-fill { height: 100%; background: #6f86ff; border-radius: 4px; }

  .thumb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; }
  .thumb { width: 100%; border-radius: 10px; background: #fff; border: 3px solid transparent; }
  .thumb.spot { border-color: #edc27a; box-shadow: 0 0 12px rgba(237, 194, 122, 0.5); }

  .word-chip-r { display: inline-block; background: #2e3347; border-radius: 999px; padding: 0.2rem 0.6rem; margin: 0 0.25rem 0.3rem 0; font-size: 0.8rem; font-weight: 700; }

  /* plan */
  .seq-item {
    display: flex; align-items: center; gap: 0.5rem;
    background: var(--rcard); border: 1px solid var(--rline);
    border-radius: 12px; padding: 0.6rem 0.7rem; margin-bottom: 0.45rem;
    font-size: 0.82rem;
  }
  .seq-item.done { opacity: 0.45; }
  .seq-item.current { border-color: var(--accent); }
  .seq-item .sq-n { width: 22px; height: 22px; border-radius: 50%; background: #2e3347; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.7rem; flex-shrink: 0; }
  .seq-item .sq-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seq-item button { font-size: 1rem; padding: 0.3rem 0.5rem; color: var(--rdim); }

  .timer-row { display: flex; gap: 0.45rem; align-items: center; flex-wrap: wrap; }
  .timer-row .rbtn { margin: 0; padding: 0.7rem 0.4rem; font-size: 0.85rem; flex: 1; min-height: 44px; }
  .timer-live { font-variant-numeric: tabular-nums; font-weight: 800; color: #9db1ff; font-size: 1.3rem; min-width: 64px; text-align: center; }

  .lesson-row {
    display: block; text-decoration: none; color: inherit;
    background: var(--rcard); border: 1px solid var(--rline);
    border-radius: 12px; padding: 0.7rem 0.8rem; margin-bottom: 0.5rem; font-size: 0.85rem;
  }
  .lesson-row b { display: block; }
  .lesson-row span { color: var(--rdim); font-size: 0.78rem; }

  /* connect gate */
  .gate { max-width: 340px; margin: 12vh auto 0; text-align: center; padding: 0 1rem; }
  .gate input {
    width: 100%; background: var(--rcard); border: 1.5px solid var(--rline); color: #fff;
    border-radius: 12px; padding: 0.85rem; font-size: 1.1rem; text-align: center; margin-top: 0.6rem;
  }
  .gate input#codeIn { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 800; }
  .gate .err { color: #e79191; font-size: 0.85rem; margin-top: 0.6rem; }

  .rtoast {
    position: fixed; bottom: 5.4rem; left: 50%; transform: translateX(-50%);
    background: #f4f2ea; color: #14161f;
    padding: 0.5rem 1rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 60;
    white-space: nowrap;
  }
  .rtoast.show { opacity: 1; }
  .conn { position: fixed; bottom: 4.9rem; left: 0; right: 0; text-align: center; font-size: 0.72rem; color: var(--rdim); }
</style>
</head>
<body>
  <div class="top">
    <span class="wordmark">Eyes Up 👀 <span style="font-weight:500;color:var(--rdim)">remote</span></span>
    <span id="topInfo"></span>
  </div>
  <main id="main"></main>

  <nav class="tabbar" id="tabbar" style="display:none">
    <button data-tab="live"><span class="ti">🎛</span>Live</button>
    <button data-tab="launch"><span class="ti">🚀</span>Launch</button>
    <button data-tab="plan"><span class="ti">🗂</span>Plan</button>
    <button data-tab="tools"><span class="ti">🛠</span>Tools</button>
    <button data-tab="more"><span class="ti">⋯</span>More</button>
  </nav>

  <div class="sheet-wrap" id="composerWrap"><div class="sheet" id="composerSheet"></div></div>
  <div class="sheet-wrap" id="summaryWrap"><div class="sheet" id="summarySheet"></div></div>

  <div class="rtoast" id="rtoast"></div>
  <div class="conn" id="conn"></div>
  <script src="/remote.js"></script>
</body>
</html>
