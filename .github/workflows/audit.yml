# Free: checks the dependencies for known vulnerabilities on every push and once a
# month, and runs the tests. A red cross on a commit means "look before deploying".
name: Safety checks
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 1 * *"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
