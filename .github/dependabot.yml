# Free: GitHub opens a pull request when a package Eyes Up uses has a security fix
# or a new version. Review and merge them like any other change.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
